name: Garagely
options:
  bundleIdPrefix: com.duolaameng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "H7DV8ZSZGB"
    CODE_SIGN_STYLE: Automatic
targets:
  Garagely:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: GaragelyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duolaameng.garagely
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Garagely
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Add a photo of a receipt or your vehicle to a service record."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos to your service and fuel records."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: IconCobalt IconGreen IconViolet IconCrimson IconSlate
      configs:
        # Debug/simulator: App Group only (no team needed, stays testable).
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Garagely.entitlements
        # Release/device: App Group + iCloud (CloudKit container binds at signing).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Garagely.release.entitlements
  GaragelyWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/Shared/GarageShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duolaameng.garagely.widget
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Widget/GaragelyWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
schemes:
  Garagely:
    build:
      targets:
        Garagely: all
    run:
      config: Debug
      storeKitConfiguration: Garagely.storekit
    archive:
      config: Release
